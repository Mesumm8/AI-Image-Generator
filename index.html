<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Updated Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <h1>AI Image Generator</h1>
            </div>
            
            <button class="theme-toggle" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <div class="main-content">
            <form class="prompt-form">
                <!-- Prompt container -->
                <div class="prompt-container">
                    <textarea class="prompt-input" placeholder="Describe your imagination in detail...." required autofocus></textarea>
                    <!-- Changed to type="button" to avoid triggering form submit -->
                    <button type="button" class="prompt-btn" title="Random Prompt">
                        <i class="fa-solid fa-dice"></i>
                    </button>
                </div>

                <!-- Prompt actions/buttons -->
                <div class="prompt-actions">
                    <!-- Model Select -->
                    <div class="select-wrapper">
                        <select class="custom-select" required>
                            <option value="" selected disabled>Select Model</option>
                            <option value="black-forest-labs/FLUX.1-schnell">FLUX.1 Schnell</option>
                            <option value="stabilityai/stable-diffusion-xl-base-1.0">Stable Diffusion XL</option>
                            <option value="runwayml/stable-diffusion-v1-5">Stable Diffusion v1.5</option>
                            <option value="prompthero/openjourney">Openjourney</option>
                        </select>
                    </div>

                    <!-- Image Quantity Select -->
                    <div class="select-wrapper">
                        <select class="custom-select">
                            <option value="1">1 Image</option>
                            <option value="2">2 Images</option>
                            <option value="3">3 Images</option>
                            <option value="4">4 Images</option>
                        </select>
                    </div>

                    <!-- Aspect Ratio Select -->
                    <div class="select-wrapper">
                        <select class="custom-select">
                            <option value="1/1" selected>Square (1:1)</option>
                            <option value="16/9">Landscape (16:9)</option>
                            <option value="9/16">Portrait (9:16)</option>
                            <option value="4/3">Standard (4:3)</option>
                        </select>
                    </div>

                    <button type="submit" class="generate-btn">
                        <i class="fa-solid fa-wand-sparkles"></i>
                        Generate
                    </button>
                </div>

                <!-- Result gallery grid -->
                <div class="gallery-grid">
                    <!-- Loading State Card -->
                    <div class="img-card loading">
                        <div class="status-container">
                            <div class="spinner"></div>
                            <p class="status-text">Generating...</p>
                        </div>
                        <img src="test.png" alt="AI Generated Output" class="result-img">
                        <div class="img-overlay">
                            <button type="button" class="img-download-btn">
                                <i class="fa-solid fa-download"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Generated Image Card 1 -->
                    <div class="img-card">
                        <img src="test.png" alt="AI Generated Output" class="result-img">
                        <div class="img-overlay">
                            <button type="button" class="img-download-btn">
                                <i class="fa-solid fa-download"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Generated Image Card 2 -->
                    <div class="img-card">
                        <img src="test.png" alt="AI Generated Output" class="result-img">
                        <div class="img-overlay">
                            <button type="button" class="img-download-btn">
                                <i class="fa-solid fa-download"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
